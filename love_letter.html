<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Favorite Person</title>
    <style>
        :root {
            --bg-color: #fff0f3;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-color: #4a4e69;
            --accent-color: #ff4d6d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Georgia', serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Canvas for the background animations */
        #animationCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Card Container Styling */
        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.15);
            max-width: 500px;
            width: 90%;
            text-align: center;
            z-index: 10;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid rgba(255, 77, 109, 0.2);
            backdrop-filter: blur(5px);
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.25);
        }

        /* Text Animations */
        .text-container {
            min-height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        p {
            font-size: 1.25rem;
            line-height: 1.8;
            font-style: italic;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            position: absolute;
            max-width: 420px;
            pointer-events: none;
        }

        p.active {
            opacity: 1;
            transform: translateY(0);
            position: relative;
            pointer-events: auto;
        }

        .typing::after {
        content: "|";
        animation: blink 1s infinite;
        color: var(--accent-color);
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }   
        /* Progress indicator at the bottom */
        .hint {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #a2a2c2;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .heart-icon {
            color: var(--accent-color);
            font-size: 1.5rem;
            margin-bottom: 15px;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <canvas id="animationCanvas"></canvas>

    <div class="card" id="letterCard">
        <div class="heart-icon">❤</div>
        <div class="text-container">
            <p class="active" data-text="I struggle with writing letters, but i wanted to make this for you to try to show you how much you mean to me..."></p>
            <p data-text="Ever since we first met youve always been the one and only thing on my mind, how beautiful you are, how cool and funny and adorable you are without even trying..."></p>
            <p data-text="It's super easy to find things about you to love and to obsess over, but as soon as i try to write it down my brain goes blank because i cant put into words how much i love you..."></p>
            <p data-text="You are perfection and ill always be by your side 5ever. I love you my beautiful princess ❤"></p>
        </div>
        <div class="hint" id="progressHint">Click to continue</div>
    </div>

    <script>
        // // --- TEXT NAVIGATION LOGIC ---
        // const card = document.getElementById('letterCard');
        // const paragraphs = document.querySelectorAll('.text-container p');
        // const hint = document.getElementById('progressHint');
        // let currentIndex = 0;

        // card.addEventListener('click', () => {
        //     // Remove active class from current paragraph
        //     paragraphs[currentIndex].classList.remove('active');
            
        //     // Move to the next paragraph
        //     currentIndex++;
            
        //     // Check if we reached the end
        //     if (currentIndex < paragraphs.length) {
        //         paragraphs[currentIndex].classList.add('active');
        //         if (currentIndex === paragraphs.length - 1) {
        //             hint.textContent = "With all my love";
        //         }
        //     } else {
        //         // Loop back to the beginning (or leave it on the last page)
        //         currentIndex = 0;
        //         paragraphs[currentIndex].classList.add('active');
        //         hint.textContent = "Click to continue";
        //     }
        // });

        // --- TEXT NAVIGATION LOGIC ---
const card = document.getElementById('letterCard');
const paragraphs = document.querySelectorAll('.text-container p');
const hint = document.getElementById('progressHint');

let currentIndex = 0;
let isTyping = false;

// TYPEWRITER EFFECT
function typeText(paragraph, text, speed = 120) {
    return new Promise(resolve => {
        paragraph.textContent = '';
        //paragraph.classList.add('active');
        paragraph.classList.add('active', 'typing');

        const words = text.split(' ');
        let index = 0;

        isTyping = true;

        const interval = setInterval(() => {
            paragraph.textContent +=
                (index === 0 ? '' : ' ') + words[index];

            index++;

            if (index >= words.length) {
                clearInterval(interval);
                paragraph.classList.remove('typing');
                isTyping = false;
                resolve();
            }
        }, speed);
    });
}

// Start first paragraph typing immediately
typeText(
    paragraphs[0],
    paragraphs[0].dataset.text,
    110
);

card.addEventListener('click', async () => {

    // Prevent skipping while typing
    if (isTyping) return;

    // Hide current paragraph
    paragraphs[currentIndex].classList.remove('active');

    // Move to next paragraph
    currentIndex++;

    // Loop back to start
    if (currentIndex >= paragraphs.length) {
        currentIndex = 0;
        hint.textContent = "Click to continue";
    }

    // Update final hint text
    if (currentIndex === paragraphs.length - 1) {
        hint.textContent = "With all my love";
    }

    // Type next paragraph
    await typeText(
        paragraphs[currentIndex],
        paragraphs[currentIndex].dataset.text,
        110
    );
});

        // --- BACKGROUND ANIMATION LOGIC (Flowers & Sparkles) ---
        const canvas = document.getElementById('animationCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const elements = [];

        class Particle {
            constructor(type) {
                this.type = type; // 'petal' or 'sparkle'
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height - canvas.height;
                this.size = Math.random() * 6 + 4;
                this.speedY = Math.random() * 1.5 + 0.5;
                this.speedX = Math.random() * 1 - 0.5;
                this.opacity = Math.random() * 0.5 + 0.3;
                
                // Petal specific properties
                this.angle = Math.random() * Math.PI * 2;
                this.spin = Math.random() * 0.02 - 0.01;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.y / 30) * 0.5; // gentle swaying
                
                if (this.type === 'petal') {
                    this.angle += this.spin;
                }

                // Reset particle to top if it leaves screen
                if (this.y > canvas.height) {
                    this.y = -20;
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.translate(this.x, this.y);

                if (this.type === 'petal') {
                    ctx.rotate(this.angle);
                    ctx.fillStyle = '#ffb3c1'; // Soft pink petal color
                    ctx.beginPath();
                    // Draw a simple cherry blossom petal shape
                    ctx.ellipse(0, 0, this.size, this.size * 1.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Draw a shiny sparkle star
                    ctx.fillStyle = '#fff';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#ff4d6d';
                    ctx.beginPath();
                    for (let i = 0; i < 4; i++) {
                        ctx.lineTo(0, -this.size);
                        ctx.rotate(Math.PI / 2);
                        ctx.lineTo(0, -this.size / 3);
                        ctx.rotate(Math.PI / 2);
                    }
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        // Initialize particles (mix of 40 petals and 30 sparkles)
        for (let i = 0; i < 40; i++) elements.push(new Particle('petal'));
        for (let i = 0; i < 30; i++) elements.push(new Particle('sparkle'));

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            elements.forEach(el => {
                el.update();
                el.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
